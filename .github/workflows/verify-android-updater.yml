name: Validate Android updater
on:
  push:
    branches: [android-in-app-updates]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check && npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: npm run prepare:android
      - run: gradle -p android assembleRelease testReleaseUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-updater-validation
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/test-results/testReleaseUnitTest/*.xml
