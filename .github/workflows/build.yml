name: Build TomiTrack
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tomitrack-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check && npm test
  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore development signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tomitrack-development-signing-v1
      - run: npm run prepare:android
      - run: gradle -p android assembleDebug --no-daemon
      - run: node scripts/collect-android.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/*.apk
  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts
          merge-multiple: true
      - name: Publish early-access builds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          cd artifacts
          sha256sum *.apk *.exe > SHA256SUMS.txt
          cd ..
          if ! gh release view "$version" >/dev/null 2>&1; then
            gh release create "$version" --target "$GITHUB_SHA" --title "TomiTrack $version · Early access" --notes-file RELEASE-NOTES.md
          fi
          gh release upload "$version" artifacts/* --clobber
