name: Preserve Android update identity
on:
  push:
    branches: [android-signing-preservation]
    paths: ['.github/workflows/preserve-signing.yml']
permissions:
  contents: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: tomitrack-development-signing-v1
          fail-on-cache-miss: true
      - name: Encrypt signing identity for private preservation
        env:
          TRANSPORT_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEApNvG22sv8RnNilRl1MYB
            Dlzi9pMRB0WYSc6cc9Om72PBCw16VL1OtHTUjNLPkASF26HdnwhUFVWH28ARPrYE
            J9+WmTZ93SxQUuaPyI56S5nEa+w7F7zC3xwYuiMyGRG5HWNoon4961mrV8y3NMVf
            G/AAdULm1qX//eVTRBFdKWpDYndAQU7QzdqWq0yE8Pc3dfXwXKvNE3sPk+ncMLmi
            6n9IPZjQLikWjQ4gssJxHOj5lDYODvOqObhXPt8lBmL1S8KNqzDCKKmECNJimP0E
            x6ArXik1BNuQrTS00+IENSmFPNkjDWb3/muoFykiZdkqz6hj7IavlhwOB/hRudHw
            GBh0UD0xvM5U0BZ0z9BWXUDv/jgCYUdkwMIQqkxA+yXZujHNTFGK2EoaEG4s7NZ6
            LB8du36cXDQ085XKuN0O18cUxGvWx/fjZ+ZKLH/spMbUYPagFulbUUFVd/O31MrW
            UJrxlvQ13mMRhNSNqGZdPwGvC6curOKU+GePzi8xGozzAgMBAAE=
            -----END PUBLIC KEY-----
        run: |
          python -m pip install cryptography --quiet
          python - <<'PYCODE'
          import os,json,base64,pathlib
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          public=serialization.load_pem_public_key(os.environ['TRANSPORT_PUBLIC_KEY'].encode())
          key=AESGCM.generate_key(bit_length=256);nonce=os.urandom(12)
          source=pathlib.Path.home()/'.android/debug.keystore'
          encrypted=AESGCM(key).encrypt(nonce,source.read_bytes(),b'TomiTrack Android signing preservation v1')
          wrapped=public.encrypt(key,padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          enc=lambda b:base64.b64encode(b).decode()
          pathlib.Path('signing-identity.encrypted.json').write_text(json.dumps({'key':enc(wrapped),'nonce':enc(nonce),'ciphertext':enc(encrypted)}))
          print('Encrypted identity ready; no private key was written to logs or public source.')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-signing-preservation
          path: signing-identity.encrypted.json
          retention-days: 1
