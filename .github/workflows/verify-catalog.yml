name: Validate release catalog
on:
  push:
    branches: [catalog-2014-forward]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-catalog.mjs
      - run: git diff --exit-code -- catalog/catalog.json catalog/import-report.json web/app/catalog/data.js
      - run: npm run check && npm test
      - run: python3 scripts/build-catalog-db.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: npm run prepare:android
      - run: gradle -p android assembleRelease testReleaseUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-validation
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            artifacts/TomiTrack-catalog.sqlite
            android/app/build/test-results/testReleaseUnitTest/*.xml
